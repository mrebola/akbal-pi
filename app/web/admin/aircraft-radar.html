<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Akbal · AIRCRAFT RADAR</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
  <link rel="stylesheet" href="aircraft-radar.css" />
</head>
<body>
  <!-- Built by topbar.js (shared across all 6 admin pages) -->
  <header class="topbar" id="topbar" data-page="aircraft-radar"></header>

  <div class="ar-toolbar">
    <div class="ar-title">AIRCRAFT RADAR</div>
    <!-- LIVE/DEMO + MAPA/RADAR move in here, next to the already-existing
         radar-specific summary readout, instead of a separate toolbar row. -->
    <div class="ar-controls">
      <div class="plx-toggle" id="platform-toggle" title="Fuente de datos: LIVE usa el HackRF real · DEMO muestra aeronaves sintéticas" data-i18n-title="aircraft.platform_toggle_title">
        <span class="plx-toggle-label mode-live" data-mode="live" data-i18n="topbar.live">LIVE</span>
        <span class="plx-toggle-label mode-demo" data-mode="demo" data-i18n="topbar.demo">DEMO</span>
      </div>
      <div class="hdr-view-toggle" id="ar-view-toggle" role="switch" aria-checked="false" tabindex="0"
           title="Ver: mapa real de la zona / radar circular por distancia" data-i18n-title="aircraft.view_toggle_title">
        <span class="hdr-view-label active" id="ar-view-label-map" data-i18n="gps.view_map">MAPA</span>
        <span class="hdr-view-track"><span class="hdr-view-knob"></span></span>
        <span class="hdr-view-label" id="ar-view-label-radar" data-i18n="aircraft.view_radar">RADAR</span>
      </div>
    </div>
    <div class="ar-summary">
      <span id="ar-count">0</span> <span data-i18n="aircraft.summary_detected">aeronaves detectadas</span>
      <span class="ar-sep">·</span>
      <span id="ar-mpm">0</span> msg/min
      <span class="ar-sep">·</span>
      <span id="ar-hardware" class="mono">—</span>
    </div>
  </div>

  <main class="ar-main">
    <!-- List: cards sorted by distance, closest first — same content as
         the radar's own labels, just easier to scan/tap than the dots. -->
    <section class="ar-list" id="ar-list" aria-label="Aeronaves detectadas" data-i18n-aria-label="aircraft.list_aria">
      <div class="ar-empty" id="ar-empty" data-i18n="aircraft.searching">Buscando aeronaves…</div>
      <!-- Zone list (24 h): every aircraft captured inside the zone around Akbal
           in the last 24 h, with the time it was last seen. Filled by
           aircraft-zone.js from /api/aircraft/zone. -->
      <div class="ar-zone" id="ar-zone" aria-label="Aeronaves en la zona">
        <ul class="ar-zone-list" id="ar-zone-list"></ul>
        <div class="ar-zone-detail hidden" id="ar-zone-detail">
          <div class="ar-zone-detail-title" id="ar-zone-detail-title"></div>
          <table class="ar-zone-table">
            <thead><tr><th>Fecha y hora</th><th>Altitud (ft)</th><th>Velocidad (kt)</th></tr></thead>
            <tbody id="ar-zone-sightings"></tbody>
          </table>
        </div>
      </div>
    </section>


    <!-- Two views behind the MAPA/RADAR toggle (see index.html/gps.html's
         MAPA/GLOBO pattern): a real Leaflet map with Akbal + every aircraft
         plotted by its actual lat/lon (the zone they're flying over), or
         the circular radar (Akbal at the center, aircraft placed by
         bearing/distance, rings at 10/25/50/100km). The map needs no GPS
         fix on Akbal's side to show aircraft — their own ADS-B position is
         absolute; only Akbal's own marker needs a fix. -->
    <section class="ar-radar-wrap">
      <div id="ar-map" class="ar-map"></div>
      <canvas id="ar-radar" class="ar-radar hidden"></canvas>
      <div class="ar-radar-legend hidden" id="ar-radar-legend">
        <span>10</span><span>25</span><span>50</span><span>100 km</span>
      </div>
      <div class="ar-nofix hidden" id="ar-nofix" data-i18n="aircraft.nofix">Sin fix GPS — mostrando lista sin radar</div>
      <div class="ar-map-error hidden" id="ar-map-error"></div>
    </section>
  </main>

  <!-- Detail card: click an aircraft in the list or on the radar. -->
  <div id="ar-detail-modal" class="apm hidden">
    <div class="apm-backdrop"></div>
    <div class="apm-card ar-detail-card">
      <button id="ar-detail-close" class="apm-close">✕</button>
      <div id="ar-detail-body" class="ar-detail-body"></div>
    </div>
  </div>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="i18n.js"></script>
  <script src="topbar.js"></script>
  <script src="wd-notify.js"></script>
  <script type="module" src="aircraft-radar.js"></script>
  <script type="module" src="aircraft-zone.js"></script>
</body>
</html>
