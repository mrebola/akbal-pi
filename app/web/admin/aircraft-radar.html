<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Akbal · AIRCRAFT RADAR</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
  <link rel="stylesheet" href="aircraft-radar.css" />
</head>
<body>
  <!-- Same topbar as the rest of the admin UI (see index.html/wifiradar.html) —
       same classes from styles.css, kept live here too instead of a static
       "back" link, so this reads as part of the same app. -->
  <header class="topbar">
    <div class="brand-group">
      <img id="avatar" class="avatar" src="/avatar/standing.gif" alt="Akbal" />
      <div class="brand">AKBAL</div>
    </div>
    <button type="button" id="nav-toggle" class="nav-toggle" aria-label="Menú" aria-expanded="false" aria-controls="main-tabs">
      <span></span><span></span><span></span>
    </button>
    <nav class="tabs" id="main-tabs">
      <a href="/#chat" class="tab-link">Chat</a>
      <a href="/wifiradar" class="tab-link">Radar Wi-Fi</a>
      <span class="tab-link active">Aviones</span>
      <a href="/#wardrive" class="tab-link">Audit WiFi</a>
      <a href="/gps" class="tab-link">GPS</a>
      <a href="/#music" class="tab-link">OST</a>
      <a href="/#usb" class="tab-link">Dispositivos</a>
      <a href="/#wifi" class="tab-link">Wifi</a>
      <a href="/#settings" class="tab-link">Ajustes</a>
    </nav>
    <div id="nav-backdrop" class="nav-backdrop hidden"></div>

    <div class="hdr-right">
      <div class="plx-toggle" id="platform-toggle" title="Fuente de datos: LIVE usa el HackRF real · DEMO muestra aeronaves sintéticas">
        <span class="plx-toggle-label mode-live" data-mode="live">LIVE</span>
        <span class="plx-toggle-label mode-demo" data-mode="demo">DEMO</span>
      </div>
      <div class="hdr-view-toggle" id="ar-view-toggle" role="switch" aria-checked="false" tabindex="0"
           title="Ver: mapa real de la zona / radar circular por distancia">
        <span class="hdr-view-label active" id="ar-view-label-map">MAPA</span>
        <span class="hdr-view-track"><span class="hdr-view-knob"></span></span>
        <span class="hdr-view-label" id="ar-view-label-radar">RADAR</span>
      </div>
      <button type="button" id="sys-toggle" class="hdr-summary" title="Estado del sistema">
        <span class="hdr-dot" id="hdr-online-dot"></span>
        <span class="hdr-model" id="hdr-model">—</span>
        <span class="battery-indicator" id="battery-indicator" title="Batería">
          <span id="battery-icon">🔋</span>
          <span id="battery-pct">—</span>
        </span>
        <span class="hdr-gear">◉</span>
      </button>
      <div id="sys-popover" class="popover hidden" role="menu">
        <div class="popover-title">Sistema</div>
        <div class="metric-row"><span class="metric-key">CPU</span><span class="metric-val mono" id="stat-cpu">—</span></div>
        <div class="metric-row"><span class="metric-key">RAM</span><span class="metric-val mono" id="stat-ram">—</span></div>
        <div class="metric-row"><span class="metric-key">Disco</span><span class="metric-val mono" id="stat-disk">—</span></div>
        <div class="metric-row"><span class="metric-key">Wi-Fi</span><span class="metric-val" id="hdr-wifi">—</span></div>
        <div class="metric-row"><span class="metric-key">Modelo</span><span class="metric-val mono" id="hdr-model-full">—</span></div>
        <div class="popover-sep"></div>
        <button id="logout-btn" class="btn btn-tertiary btn-block" title="Cerrar sesión">Cerrar sesión</button>
      </div>
    </div>
    <span id="status-pill" class="hidden">—</span>
  </header>

  <div class="ar-toolbar">
    <div class="ar-title">AIRCRAFT RADAR</div>
    <div class="ar-summary">
      <span id="ar-count">0</span> aeronaves detectadas
      <span class="ar-sep">·</span>
      <span id="ar-mpm">0</span> msg/min
      <span class="ar-sep">·</span>
      <span id="ar-hardware" class="mono">—</span>
    </div>
  </div>

  <main class="ar-main">
    <!-- List: cards sorted by distance, closest first — same content as
         the radar's own labels, just easier to scan/tap than the dots. -->
    <section class="ar-list" id="ar-list" aria-label="Aeronaves detectadas">
      <div class="ar-empty" id="ar-empty">Buscando aeronaves…</div>
    </section>

    <!-- Two views behind the MAPA/RADAR toggle (see index.html/gps.html's
         MAPA/GLOBO pattern): a real Leaflet map with Akbal + every aircraft
         plotted by its actual lat/lon (the zone they're flying over), or
         the circular radar (Akbal at the center, aircraft placed by
         bearing/distance, rings at 10/25/50/100km). The map needs no GPS
         fix on Akbal's side to show aircraft — their own ADS-B position is
         absolute; only Akbal's own marker needs a fix. -->
    <section class="ar-radar-wrap">
      <div id="ar-map" class="ar-map"></div>
      <canvas id="ar-radar" class="ar-radar hidden"></canvas>
      <div class="ar-radar-legend hidden" id="ar-radar-legend">
        <span>10</span><span>25</span><span>50</span><span>100 km</span>
      </div>
      <div class="ar-nofix hidden" id="ar-nofix">Sin fix GPS — mostrando lista sin radar</div>
      <div class="ar-map-error hidden" id="ar-map-error"></div>
    </section>
  </main>

  <!-- Detail card: click an aircraft in the list or on the radar. -->
  <div id="ar-detail-modal" class="apm hidden">
    <div class="apm-backdrop"></div>
    <div class="apm-card ar-detail-card">
      <button id="ar-detail-close" class="apm-close">✕</button>
      <div id="ar-detail-body" class="ar-detail-body"></div>
    </div>
  </div>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script type="module" src="aircraft-radar.js"></script>
</body>
</html>
