<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>DOOM · Akbal</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/doom.css" />
</head>
<body>
  <header class="topbar" id="topbar" data-page="doom"></header>

  <main class="doom-page">
    <div class="doom-head">
      <h1 class="doom-title">DOOM</h1>
      <p id="status" class="status" role="status" aria-live="polite">Conectando…</p>
      <p id="game-name" class="game-name" hidden></p>
      <p id="hint" class="hint"></p>
      <div id="warnings" class="warnings" role="alert" hidden>
        <p id="audio-warning" hidden></p>
        <p id="music-warning" hidden></p>
      </div>
    </div>

    <section class="screen-wrap">
      <canvas id="screen" width="280" height="175" hidden aria-label="Pantalla de la Pi"></canvas>
      <label class="switch">
        <input id="stream" type="checkbox" />
        <span>Ver pantalla en la web</span>
      </label>
    </section>

    <section class="console">
      <div id="closed-panel" class="closed-panel" role="status" hidden>
        <p>El juego fue cerrado.</p>
        <button id="play-again" type="button" class="btn play-here">Jugar de nuevo</button>
      </div>
      <div id="console-bar" class="console-bar">
        <button id="play-here" type="button" class="btn play-here" hidden>Jugar aquí</button>
        <button id="claim" type="button" class="btn claim" disabled>Tomar control</button>
        <div class="volume" role="group" aria-label="Volumen">
          <button id="volume-down" type="button" class="btn step" aria-label="Bajar volumen" disabled>−</button>
          <span id="volume-value" class="volume-value" aria-live="polite">—</span>
          <button id="volume-up" type="button" class="btn step" aria-label="Subir volumen" disabled>+</button>
        </div>
        <button id="quit-btn" type="button" class="btn quit" hidden>Salir del juego</button>
      </div>

      <div id="controls" class="controls locked">
        <div class="dpad" role="group" aria-label="Movimiento">
          <button class="key" type="button" data-key="strafeLeft" tabindex="-1">
            <span class="label">Lat. izq.</span><small>A</small>
          </button>
          <button class="key" type="button" data-key="forward" tabindex="-1">
            <span class="label">Avanzar</span><small>W · ↑</small>
          </button>
          <button class="key" type="button" data-key="strafeRight" tabindex="-1">
            <span class="label">Lat. der.</span><small>D</small>
          </button>
          <button class="key" type="button" data-key="left" tabindex="-1">
            <span class="label">Girar izq.</span><small>←</small>
          </button>
          <span class="dpad-center" aria-hidden="true"></span>
          <button class="key" type="button" data-key="right" tabindex="-1">
            <span class="label">Girar der.</span><small>→</small>
          </button>
          <span class="dpad-empty" aria-hidden="true"></span>
          <button class="key" type="button" data-key="back" tabindex="-1">
            <span class="label">Retroceder</span><small>S · ↓</small>
          </button>
          <span class="dpad-empty" aria-hidden="true"></span>
        </div>

        <div class="actions" role="group" aria-label="Acciones">
          <button class="key run" type="button" data-key="run" tabindex="-1">
            <span class="label">Correr</span><small>Shift</small>
          </button>
          <button class="key use" type="button" data-key="use" tabindex="-1">
            <span class="label">Abrir / usar</span><small>E</small>
          </button>
          <button class="key fire" type="button" data-key="fire" tabindex="-1">
            <span class="label">Disparar</span><small>Ctrl · Espacio</small>
          </button>
          <button class="key menu" type="button" data-key="menu" tabindex="-1">
            <span class="label">Menú</span><small>Esc</small>
          </button>
        </div>

        <div class="weapons" role="group" aria-label="Cambiar arma">
          <span class="weapons-title">Cambiar arma</span>
          <div class="weapon-keys">
            <button class="key" type="button" data-key="weapon1" tabindex="-1"><span class="label">Arma 1</span><small>1</small></button>
            <button class="key" type="button" data-key="weapon2" tabindex="-1"><span class="label">Arma 2</span><small>2</small></button>
            <button class="key" type="button" data-key="weapon3" tabindex="-1"><span class="label">Arma 3</span><small>3</small></button>
            <button class="key" type="button" data-key="weapon4" tabindex="-1"><span class="label">Arma 4</span><small>4</small></button>
            <button class="key" type="button" data-key="weapon5" tabindex="-1"><span class="label">Arma 5</span><small>5</small></button>
            <button class="key" type="button" data-key="weapon6" tabindex="-1"><span class="label">Arma 6</span><small>6</small></button>
            <button class="key" type="button" data-key="weapon7" tabindex="-1"><span class="label">Arma 7</span><small>7</small></button>
          </div>
        </div>
      </div>
    </section>

    <div id="rotate-hint" class="rotate-hint" role="status" hidden>
      <span class="rotate-icon" aria-hidden="true"></span>
      <p>Gira tu iPhone a horizontal</p>
    </div>
  </main>

  <script src="/i18n.js"></script>
  <script src="/topbar.js"></script>
  <script src="/doom.js" defer></script>
</body>
</html>
